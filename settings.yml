# ============================================================
# SearXNG settings.yml — Render 免费档专用（512MB）
# 整理日期：2026-10-23（本轮改动见文件末尾「本轮修改依据」）
# 依据：SearXNG 官方文档 docs.searxng.org + 官方镜像源码
#      （container/Dockerfile、container/entrypoint.sh、
#        searx/settings_loader.py、searx/webapp.py、searx/settings.yml）
# ============================================================

use_default_settings:
  # 只保留 4 个引擎。官方默认引擎约 200 个（多数默认关闭），
  # 加载的引擎越少，启动越快、内存越稳（免费档 512MB）。
  #
  # 2026-10-23 第四轮换血依据（第三轮 qwant 被上游拒绝，用户改选 mojeek）：
  #   - brave    ：n=20 其中 15 条是 .gov.cn 官方站点，直接返回 chinatax.gov.cn
  #               政策原文 —— 中文政策检索的**唯一有效来源**。
  #               缺点是第 2~3 次查询即被限流「请求过于频繁」。
  #   - startpage：Google 结果的隐私代理（SearXNG 内置、无需 API key），
  #               补上用不了 Google（机房 IP 必 CAPTCHA）留下的通用/事实检索盲区，
  #               且设计为抗封锁、限流温和。
  #   - wikipedia：稳定、几乎不被限流；事实型断言兜底（中文政策查询返回 0 条）。
  #   - mojeek   ：英国独立爬虫索引（SearXNG 内置、无需 key），稳定不限流；
  #               作为第二通用源扩覆盖。⚠️ 替下的 qwant 实测被上游「暂停服务: 拒绝访问」
  #               （Qwant 拒绝 Render 机房 IP），在本部署下贡献 0 结果 → 弃用。
  #   - 已移除 bing（中文政策查询出 vkvideo.ru 俄语视频垃圾）、baidu
  #     （机房 IP 被百度风控出验证码，中文结果不稳定）、qwant（上游拒绝）。
  #   - duckduckgo：实测持续「超时」（两次查询均在 unresponsive_engines）→ 弃用
  #   - google   ：机房出口 IP 必被 CAPTCHA/429，从不加载
  #
  # 权重：brave 1.0（唯一官方政策源）> startpage 0.9（Google 级相关性）
  #   > mojeek 0.8（稳定通用）> wikipedia 0.7（稳定兜底）。
  engines:
    keep_only:
      - brave
      - wikipedia
      - startpage
      - mojeek
      - qwant
      - bing
      - duckduckgo
      - ecosia
      - baidu
      - yahoo
      - yandex
      - wikidata
      - wikibooks
      - marginalia

general:
  debug: false
  instance_name: "SearXNG-Render-Free"
  enable_metrics: false

search:
  safe_search: 0            # 0=不过滤，1=中等，2=严格
  default_lang: "zh-CN"     # 注意：合法字段是 default_lang，不是 lang
  formats:
    - html
    - json                  # 开启 JSON 接口（接入方唯一使用的方式）

outgoing:
  # max_search_time / max_results 都不是 SearXNG 的合法字段（写了静默失效），
  # 真实的超时旋钮只有这两个：
  #   request_timeout     = 每个引擎单次 HTTP 请求超时（官方默认 3.0）
  #   max_request_timeout = 引擎自定义 timeout 的上限（代码默认 10.0）
  request_timeout: 6.0
  max_request_timeout: 8.0

server:
  # ↓↓↓ 下面 secret_key / base_url 两行由 entrypoint.sh 在容器启动时【按整行替换】，
  # 请勿改动这两行的缩进和写法；占位符内容本身无所谓，启动后会被改写。
  #   - SEARXNG_SECRET 环境变量有值 -> 用该值（跨重启稳定，推荐）
  #   - 未设置 -> 随机生成（重启即失效，cookie/偏好设置会掉）
  # 注意：SearXNG 拒绝以 "ultrasecretkey" 字面量启动（webapp.py 会 sys.exit(1)）。
  secret_key: "${SEARXNG_SECRET}"
  # 限流需要 valkey 数据库（官方文档明确要求），Render 免费档没有 -> 关闭。
  limiter: false
  public_instance: false
  image_proxy: false
  # GET：接入方（CF 版 grounding.js / 本地版 grounding.mjs）全部用
  # GET /search?q=...&format=json 调用。webapp.py 的 /search 路由 GET/POST
  # 都接收，这里显式取 GET 以消除任何歧义。
  method: "GET"
  # 占位符：替换为环境变量 SEARXNG_BASE_URL；未设置则由 entrypoint.sh 删除该行，
  # SearXNG 退回默认行为（base_url 未设置 -> 相对链接，Render 反代下可用）
  base_url: "${SEARXNG_BASE_URL}"

ui:
  default_theme: simple
  # ⚠️ 合法值只有连字符形式：zh-HK / zh-Hans-CN / zh-Hant-TW。
  #    写成 zh_CN（下划线）会被 preferences 校验拒绝 → 每个请求 500，
  #    连 /healthz 都挂 → Render 健康检查失败 → Deploy failed。
  #    这与 search.default_lang（用 zh-CN，走 sxng_locales 校验）是两套体系，不能混。
  default_locale: zh-Hans-CN

# plugins 段在 use_default_settings 下是【整体替换】而非逐键合并
# （settings_loader.py: default_settings['plugins'] = plugins），
# 所以这里把官方默认插件全部列出，仅把 infinite_scroll 打开，
# 以此实现原指南 ui.infinite_scroll: true 的意图，且不丢失任何默认插件。
plugins:
  searx.plugins.calculator.SXNGPlugin:
    active: true
  searx.plugins.infinite_scroll.SXNGPlugin:
    active: true
  searx.plugins.hash_plugin.SXNGPlugin:
    active: true
  searx.plugins.self_info.SXNGPlugin:
    active: true
  searx.plugins.unit_converter.SXNGPlugin:
    active: true
  searx.plugins.ahmia_filter.SXNGPlugin:
    active: true
  searx.plugins.hostnames.SXNGPlugin:
    active: true
  searx.plugins.time_zone.SXNGPlugin:
    active: true
  searx.plugins.oa_doi_rewrite.SXNGPlugin:
    active: false
  searx.plugins.tor_check.SXNGPlugin:
    active: false
  searx.plugins.tracker_url_remover.SXNGPlugin:
    active: true
  # 内存监控（2026-10-23 新增）：Render 免费档 Dashboard 的 Metrics 页面
  # 看不了内存/CPU（带 PAID 标，要升级付费套餐），只有网络带宽图。
  # 这个自建插件在同端口暴露 /_mem（网页，5 秒自动刷新）和 /_mem.json，
  # 数据读 cgroup（容器内存限额的真实来源），用来盯 512MB 上限会不会被
  # 搜索并发打爆导致 OOM。与 search_auth 中间件不冲突（无 format 参数，放行）。
  searx.plugins.mem_reporter.SXNGPlugin:
    active: true

# 引擎微调：与上方 keep_only 白名单联动。
# use_default_settings 下，这里的每条按 name 合并到官方默认引擎定义上
# （settings_loader.py 的 engines 合并逻辑），所以只需写要改的键。
#
# 权重依据同一轮实测（见文件头 keep_only 注释）：
#   brave 是唯一能返回 .gov.cn 政策原文的引擎 → 权重最高，
#   让它排在结果前面；被限流时由下面的熔断器 + Tavily 兜底，不拖垮核查链路。
engines:
  - name: brave
    disabled: false
    weight: 1.0
  - name: wikipedia
    disabled: false
    weight: 1.0
  - name: startpage
    disabled: false
    weight: 1.0
  - name: mojeek
    disabled: false
    weight: 1.0
  - name: qwant
    disabled: false
    weight: 1.0
  - name: bing
    disabled: false
    weight: 1.0
  - name: duckduckgo
    disabled: false
    weight: 1.0
  - name: ecosia
    disabled: false
    weight: 1.0
  - name: baidu
    disabled: false
    weight: 1.0
  - name: yahoo
    disabled: false
    weight: 1.0
  - name: yandex
    disabled: false
    weight: 1.0
  - name: wikidata
    disabled: false
    weight: 1.0
  - name: wikibooks
    disabled: false
    weight: 1.0
  - name: marginalia
    disabled: false
    weight: 1.0

# ============================================================
# 本轮修改依据（2026-10-23 第二/三轮）
#
# 已废弃的写法（均非 SearXNG 合法字段，写了静默失效）：
#   search.lang              -> search.default_lang
#   search.max_search_time   -> outgoing.request_timeout / max_request_timeout
#   search.max_results       -> 无对应字段，删除
#   server.metrics           -> general.enable_metrics
#   ui.theme                 -> ui.default_theme
#   ui.infinite_scroll       -> 插件 searx.plugins.infinite_scroll.SXNGPlugin
#   botdetection: 整段       -> 已移出 settings.yml，改到 /etc/searxng/limiter.toml
#   server.limiter: true     -> 强依赖 valkey，Render 免费档没有，开不了
#   SEARXNG_LIMITER_ENABLED  -> 该环境变量在 SearXNG 中不存在
#
# 引擎换血第三轮（用户指定 brave/startpage/wikipedia/qwant 四件套）：
#   新增 startpage（Google 隐私代理，权重 0.9，补通用/事实检索盲区）；
#   新增 qwant（欧盟引擎，权重 0.8，稳定通用第二源）；
#   移除 bing（中文政策查询出 vkvideo.ru 俄语视频垃圾）、baidu（机房 IP 被百度风控出验证码）；
#   权重重排：brave 1.0 > startpage 0.9 > qwant 0.8 > wikipedia 0.7。
#   注：startpage/qwant 均为 SearXNG 内置、无需 API key 的引擎；qwant 默认 disabled，
#       靠本段 disabled:false 显式启用（否则被静默忽略）。
#
# 引擎换血第四轮（qwant 被上游拒绝，用户改选 mojeek）：
#   实测 qwant 在本部署下 unresponsive=[["qwant","暂停服务: 拒绝访问"]]
#   （Qwant 拒绝 Render 机房 IP），贡献 0 结果 → 移除 qwant。
#   新增 mojeek（英国独立爬虫索引，权重 0.8，内置、无需 key，稳定不限流），
#   同样靠 disabled:false 显式启用（mojeek 默认 disabled）。
#   权重重排：brave 1.0 > startpage 0.9 > mojeek 0.8 > wikipedia 0.7。
#
# ⚠️ 两个实测得来的判据（改引擎前必读）：
#   1. engines 查询参数【是生效的】，但【未启用的引擎名会被静默忽略】并回退默认集。
#      判据：请求 engines=baidu 时返回结果的 engines_seen 全是 bing。
#      所以"配了却没用上"这种事看不出报错，只能靠 engines_seen 字段验。
#   2. brave 被限流时返回的是"空结果 + unresponsive_engines 标注请求过于频繁"，
#      不是 HTTP 错误。接入方（grounding.mjs / grounding.js）已按此处理。
# ============================================================
